name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}' -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/OcrSearch.App/OcrSearch.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath OcrSearch-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: OcrSearch-${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
